<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7488;--pr:#3b5bdb;--ok:#2f9e44;--okbg:#d3f9d8;--no:#e03131;--nobg:#ffe3e3;--bd:#dfe3ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--tx:#eef1f7;--mu:#98a1b5;--pr:#748ffc;--ok:#69db7c;--okbg:#18391f;--no:#ff8787;--nobg:#401a1a;--bd:#2c3446}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--tx:#eef1f7;--mu:#98a1b5;--pr:#748ffc;--ok:#69db7c;--okbg:#18391f;--no:#ff8787;--nobg:#401a1a;--bd:#2c3446}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:4px 0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab,.mode{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:14px;white-space:nowrap;cursor:pointer}
.tab.on,.mode.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.modes{display:flex;gap:8px;margin:8px 0}.mode{flex:1;text-align:center;border-radius:12px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:18px;margin-top:8px;transition:.2s}
.card.ok{border-color:var(--ok);background:var(--okbg)}.card.no{border-color:var(--no);background:var(--nobg)}
.big{font-size:28px;font-weight:700;text-align:center;direction:ltr;margin:10px 0;word-break:break-word}
.ar{font-size:22px;text-align:center;margin:8px 0}
.mu{color:var(--mu);font-size:13px;text-align:center}
input[type=text]{width:100%;font-size:20px;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);direction:ltr;text-align:left;margin-top:10px}
.row{display:flex;gap:8px;margin-top:10px}
button.b{flex:1;border:0;border-radius:12px;padding:13px;font-size:16px;cursor:pointer;background:var(--pr);color:#fff}
button.b.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.b:disabled{opacity:.4}
.hint{direction:ltr;text-align:center;color:var(--pr);font-size:18px;min-height:24px;margin-top:8px}
.prog{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0 2px}.prog i{display:block;height:100%;background:var(--ok)}
.kb{direction:ltr;margin-top:12px}.kr{display:flex;gap:4px;margin-bottom:5px;justify-content:center}.k{flex:1;max-width:46px;min-height:46px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:19px;cursor:pointer;padding:0}.k.w{max-width:none;flex:4}.k:active{background:var(--pr);color:#fff}
details{margin-top:14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
summary{cursor:pointer;font-size:14px}
</style>
</head>

<div class="mu" id="stat"></div>
<div class="mu" id="snd" style="color:var(--no)"></div>
<div class="prog"><i id="bar" style="width:0"></i></div>
<div class="card" id="card"></div>

<div class="mu" id="aMsg"></div></details>

function kb(inp){const w=el("div","kb");const rows=[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l"],["z","x","c","v","b","n","m"],["'","-",".",",","?","space","⌫"]];
 for(const r of rows){const d=el("div","kr");for(const k of r){const b=el("button","k"+(k==="space"?" w":""),k==="space"?"␣":k);b.type="button";b.onmousedown=e=>e.preventDefault();b.onclick=()=>{if(k==="⌫")inp.value=inp.value.slice(0,-1);else inp.value+=(k==="space"?" ":k)};d.appendChild(b)}w.appendChild(d)}return w}
function tabs(){const t=$("tabs");t.innerHTML="";for(const k in G){const b=document.createElement("button");b.className="tab"+(k===S.g?" on":"");b.textContent=G[k];b.onclick=()=>{S.g=k;S.u="";start();tabs()};t.appendChild(b)}
{const us=[...new Set(D[S.g].w.concat(D[S.g].s).map(x=>x[2]).filter(Boolean))];const se=$("unit");se.innerHTML="";se.style.display=us.length?"block":"none";const o0=el("option","","كل الوحدات");o0.value="";se.appendChild(o0);us.forEach(u=>{const o=el("option","","الوحدة "+u);o.value=u;se.appendChild(o)});se.value=S.u}
$("mw").className="mode"+(S.m==="w"?" on":"");$("ms").className="mode"+(S.m==="s"?" on":"")}
function stat(){const all=items();const p=prog[pk()]||{};const n=all.filter(x=>p[x[0]]).length;$("stat").textContent="متقن: "+n+" من "+all.length;$("bar").style.width=(all.length?n/all.length*100:0)+"%"}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){
stat();const c=$("card");c.className="card";c.innerHTML="";
if(S.done){c.appendChild(el("div","ar","🎉 خلصت الدفعة دي!"));const b=el("button","b","ابدأ تاني");b.onclick=start;c.appendChild(b);return}
const it=S.q[S.i];if(!it){c.appendChild(el("div","ar","مفيش عناصر هنا. ضيف من تحت."));return}
c.appendChild(el("div","mu",(S.i+1)+" / "+S.q.length));
if(S.ph==="study"){
 c.appendChild(el("div","big",it[0]));c.appendChild(el("div","ar",it[1]));
 const r=el("div","row");const sp=el("button","b g","🔊 نطق");sp.onclick=()=>speak(it[0],true);
 const go=el("button","b","اخفي واكتب ✍️");go.onclick=()=>{S.ph="type";S.helps=0;render()};r.append(sp,go);c.appendChild(r);
 if(S.m==="w"||true)setTimeout(()=>speak(it[0]),150);
}else{
 c.appendChild(el("div","mu","اكتب بالإنجليزي"));c.appendChild(el("div","ar",it[1]));
 const inp=el("input");inp.type="text";inp.id="inp";inp.autocomplete="off";inp.autocapitalize="off";inp.spellcheck=false;inp.setAttribute("autocorrect","off");inp.setAttribute("data-gramm","false");inp.name="a"+Date.now();inp.setAttribute("dir","ltr");inp.readOnly=true;inp.setAttribute("inputmode","none");c.appendChild(inp);
 const h=el("div","hint");h.id="hint";c.appendChild(h);
 const r=el("div","row");const hb=el("button","b g","💡 مساعدة ("+(2-S.helps)+")");hb.disabled=S.helps>=2;
 const ck=el("button","b","تأكيد ✔");r.append(hb,ck);c.appendChild(r);
 hb.onclick=()=>{if(S.helps>=2)return;S.helps++;S.clean=false;help(it);hb.textContent="💡 مساعدة ("+(2-S.helps)+")";hb.disabled=S.helps>=2};
 ck.onclick=()=>check(it);c.appendChild(kb(inp));
}}
function help(it){const inp=$("inp");const a=it[0];
 if(S.m==="w"){const cur=inp.value;let p=0;while(p<cur.length&&p<a.length&&cur[p].toLowerCase()===a[p].toLowerCase())p++;inp.value=a.slice(0,Math.min(p+1,a.length))}
 else{const aw=a.split(" ");const tw=inp.value.trim().split(/\s+/).filter(Boolean);let k=0;while(k<tw.length&&k<aw.length&&norm(tw[k])===norm(aw[k]))k++;
  $("hint").textContent=k<aw.length?"الكلمة اللي بعد كده تبدأ بـ: "+aw[k][0]:"الجملة كاملة!"}
 inp.focus()}
function check(it){const inp=$("inp");if(!inp.value.trim())return;const c=$("card");
 if(norm(inp.value)===norm(it[0])){c.className="card ok";
  const p=prog[pk()]||{};if(S.clean&&S.firstTry!==false){p[it[0]]=1;prog[pk()]=p;sv("wl_p",prog)}
  stat();setTimeout(()=>{S.i++;S.firstTry=true;S.clean=true;S.helps=0;S.ph="study";if(S.i>=S.q.length)S.done=true;render()},700)}
 else{c.className="card no";S.clean=false;S.firstTry=false;setTimeout(()=>{S.ph="study";render()},900)}}
$("unit").onchange=e=>{S.u=e.target.value;start()};
$("mw").onclick=()=>{S.m="w";tabs();start()};$("ms").onclick=()=>{S.m="s";tabs();start()};
$("aBtn").onclick=()=>{const e=$("aEn").value.trim(),a=$("aAr").value.trim();if(!e||!a){$("aMsg").textContent="اكتب الاتنين";return}
 custom[S.g]=custom[S.g]||{};custom[S.g][S.m]=custom[S.g][S.m]||[];custom[S.g][S.m].push([e,a]);sv("wl_c",custom);
 $("aEn").value="";$("aAr").value="";$("aMsg").textContent="اتضافت ✅";start()};
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
document.addEventListener("keydown",e=>{if(S.ph!=="type"||S.done)return;const t=e.target.tagName;if(t==="INPUT"&&e.target.id!=="inp"||t==="BUTTON"||e.ctrlKey||e.metaKey)return;const i=$("inp");if(!i)return;if(e.key==="Backspace"){i.value=i.value.slice(0,-1);e.preventDefault()}else if(e.key==="Enter"){check(S.q[S.i])}else if(e.key.length===1){i.value+=e.key;e.preventDefault()}});
S.firstTry=true;tabs();start();
</script>
</body>
